<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070b06">
<meta name="robots" content="noindex">
<title>PROTOTYPE — Front Page Variants | OOZEMeter</title>
<!-- THROWAWAY PROTOTYPE. Three structurally different front pages, switchable
     via ?variant=A|B|C and the floating bar. Question being answered:
     "Should the front page lead with the instrument, the story, or split them?"
     Judge reading order / hierarchy / flow only. Winner folds into index.html;
     this file then moves to a throwaway branch. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800;900&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lab.css">
<style>
/* prototype-only styles — deliberately lean on lab.css for everything real */
.pv-mast{display:flex;align-items:center;gap:18px;padding:18px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pv-mast .mini-jar{transform:scale(.32);transform-origin:left center;width:80px;height:110px;margin:-40px 0}
.pv-mast b{font-family:var(--display);font-weight:900;font-size:1.6rem}
.pv-mast .pv-band{font-family:var(--display);font-weight:800;letter-spacing:.18em;font-size:.8rem}
.pv-mast .pv-verdict{color:var(--muted);font-size:.8rem}
.pv-lead{padding:44px 0 36px;border-bottom:1px solid var(--line)}
.pv-lead .eyebrow{font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;margin-bottom:14px}
.pv-lead h1{font-family:var(--display);font-weight:900;font-size:clamp(1.6rem,4.4vw,2.7rem);line-height:1.15;max-width:22ch;margin-bottom:16px}
.pv-lead p.lede{font-size:1.02rem;line-height:1.75;color:var(--text);max-width:62ch;margin-bottom:14px}
.pv-lead .pv-by{font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:20px}
.pv-why{padding:36px 0;border-bottom:1px solid var(--line)}
.pv-why-row{display:grid;grid-template-columns:150px 90px 60px 1fr;gap:14px;align-items:baseline;padding:12px 0;border-top:1px solid var(--line);color:var(--text);font-size:.8rem}
.pv-why-row:first-of-type{border-top:none}
.pv-why-row:hover{text-decoration:none;color:var(--ooze)}
.pv-why-row b{font-family:var(--display);font-size:.8rem}
.pv-why-row .d{font-size:.7rem}
.pv-why-row .why-t{color:var(--muted);font-size:.72rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:720px){.pv-why-row{grid-template-columns:110px 70px 50px;grid-auto-rows:auto}.pv-why-row .why-t{grid-column:1/-1;white-space:normal}}
.pv-evidence{display:flex;gap:12px;flex-wrap:wrap;padding:28px 0}
.pv-evidence a{border:1px solid var(--line);border-radius:10px;padding:14px 18px;color:var(--muted);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}
.pv-evidence a:hover{border-color:var(--ooze);color:var(--ooze);text-decoration:none}
/* broadsheet */
.pv-sheet{display:grid;grid-template-columns:1.9fr 1fr;gap:44px;padding:36px 0}
@media(max-width:920px){.pv-sheet{grid-template-columns:1fr}}
.pv-rail{border-left:1px solid var(--line);padding-left:32px}
@media(max-width:920px){.pv-rail{border-left:none;padding-left:0;border-top:1px solid var(--line);padding-top:26px}}
.pv-rail .rail-h{font-size:.62rem;letter-spacing:.26em;text-transform:uppercase;color:var(--dim);margin:18px 0 10px}
.pv-ledger{width:100%;border-collapse:collapse;font-size:.72rem}
.pv-ledger td{padding:7px 0;border-top:1px solid var(--line)}
.pv-ledger tr:first-child td{border-top:none}
.pv-ledger .lv{font-family:var(--display);font-weight:700;text-align:right}
.pv-stack a{display:block;padding:14px 0;border-top:1px solid var(--line);color:var(--text)}
.pv-stack a:first-of-type{border-top:none}
.pv-stack a:hover{text-decoration:none;color:var(--ooze)}
.pv-stack .st-t{font-family:var(--display);font-weight:800;font-size:.92rem;line-height:1.35}
.pv-stack .st-d{font-size:.72rem;color:var(--muted);margin-top:4px}

/* D — mission control */
.pvD-brief{max-width:560px;margin:30px auto 0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 26px;position:relative;text-align:left}
.pvD-brief .stamp2{position:absolute;top:10px;right:14px;font-size:.56rem;letter-spacing:.2em;color:var(--dim)}
.pvD-brief p{font-size:.9rem;line-height:1.7;color:var(--text);margin-bottom:10px}
.pvD-brief a{font-size:.74rem;letter-spacing:.1em}
/* E — situation room */
.pvE-sheet{display:grid;grid-template-columns:1.1fr 1fr;gap:0;border:1px solid var(--line-hard);border-radius:0}
@media(max-width:860px){.pvE-sheet{grid-template-columns:1fr}}
.pvE-cell{border:1px solid var(--line-hard);padding:22px;margin:-0.5px}
.pvE-route{font-size:.6rem;letter-spacing:.3em;color:var(--dim);text-transform:uppercase;margin-bottom:14px}
.pvE-brief{font-size:.8rem;line-height:1.9;color:var(--text);text-transform:uppercase;letter-spacing:.04em}
.pvE-brief .hdr{color:var(--dim);font-size:.66rem;display:block}
.pvE-dbl{height:7px;border-top:1px solid var(--line-hard);border-bottom:1px solid var(--line-hard);margin:34px 0}
.pvE-board{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pvE-tile{border:1px solid var(--line);padding:12px 14px}
.pvE-tile b{font-family:var(--display);font-size:1rem;display:block}
.pvE-tile span{font-size:.6rem;letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
/* F — instrument */
.pvF-v1{min-height:88vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
.pvF-cap{font-size:.7rem;letter-spacing:.24em;color:var(--dim);text-transform:uppercase}
.pvF-score{position:absolute;inset:0;display:grid;place-items:center;z-index:5;pointer-events:none;font-family:var(--display);font-weight:900;font-size:3rem;color:var(--text);text-shadow:0 2px 18px rgba(7,11,6,.8)}
.pvF-sect{padding:170px 0;text-align:center}
.pvF-sect p{font-size:.98rem;line-height:1.85;color:var(--text);max-width:56ch;margin:0 auto 14px}
.pvF-why{font-size:.94rem;color:var(--muted);line-height:2.3}
/* G — command center */
.pvG{display:grid;grid-template-columns:repeat(12,1fr);gap:12px;padding:26px 0}
.pvG .gp{border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:var(--panel)}
.pvG .gp h5{font-size:.58rem;letter-spacing:.26em;color:var(--dim);text-transform:uppercase;margin-bottom:10px}
.pvG-rows a{display:grid;grid-template-columns:1fr auto;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:.74rem;color:var(--text)}
.pvG-rows a:first-of-type{border-top:none}
.pvG-rows .ts{color:var(--dim);font-size:.64rem;text-align:right}
@media(max-width:900px){.pvG .gp{grid-column:span 12!important}}
/* H — story in layers */
.pvH-layer{padding:90px 0;border-top:1px solid var(--line)}
.pvH-layer:first-of-type{border-top:none}
.pvH-q{font-size:.68rem;letter-spacing:.34em;color:var(--dim);text-transform:uppercase;margin-bottom:26px}
.pvH-brief{border-left:1px solid var(--line-hard);padding-left:26px;max-width:60ch}
.pvH-brief p{font-size:.96rem;line-height:1.8;color:var(--text);margin-bottom:12px}

/* I — instrument-first split */
.pvI{display:grid;grid-template-columns:1.8fr 1fr;gap:0;padding:30px 0 60px}
@media(max-width:920px){.pvI{grid-template-columns:1fr}}
.pvI-left{padding-right:44px;border-right:1px solid var(--line);text-align:center}
@media(max-width:920px){.pvI-left{padding-right:0;border-right:none;border-bottom:1px solid var(--line);padding-bottom:40px}}
.pvI-hr{border:none;border-top:1px solid var(--line);margin:34px 0}
.pvI-sources{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;text-align:left}
.pvI-src{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--muted);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase}
.pvI-src:hover{border-color:var(--ooze);color:var(--text);text-decoration:none}
.pvI-src b{margin-left:auto;font-family:var(--display);font-size:.74rem}
.pvI-right{padding-left:44px}
@media(max-width:920px){.pvI-right{padding-left:0;padding-top:36px}}
.pvI-right .eyebrow{font-size:.6rem;letter-spacing:.28em;text-transform:uppercase;color:var(--ooze);margin-bottom:12px}
.pvI-right h1{font-family:var(--display);font-weight:800;font-size:1.35rem;line-height:1.3;margin-bottom:16px;max-width:24ch}
.pvI-right p{font-size:.88rem;line-height:1.75;color:var(--text);max-width:42ch;margin-bottom:12px}
.pvI-right .pv-by{font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:4px 0 18px}

/* J — mission control × research library */
.pvJ{display:grid;grid-template-columns:2.3fr 1fr;gap:0;padding:10px 0 80px}
@media(max-width:920px){.pvJ{grid-template-columns:1fr}}
.pvJ-left{padding:50px 56px 0 0;border-right:1px solid var(--line);text-align:center}
@media(max-width:920px){.pvJ-left{padding-right:0;border-right:none}}
.pvJ-gap{height:76px}
.pvJ-gap.sm{height:44px}
.pvJ-label{font-size:.62rem;letter-spacing:.34em;color:var(--dim);text-transform:uppercase;margin-bottom:26px}
/* final form: hero placard column */
.pk-hero{display:flex;align-items:center;justify-content:center;gap:40px;flex-wrap:wrap}
.pk-plc{display:flex;flex-direction:column;gap:22px;text-align:left}
.pk-plc div{display:flex;gap:12px;align-items:flex-start}
.pk-plc .ic{font-size:1rem;width:22px;text-align:center}
.pk-plc b{display:block;font-size:.64rem;letter-spacing:.22em;text-transform:uppercase;color:var(--text)}
.pk-plc span{font-size:.62rem;color:var(--dim)}
/* canister cards */
.pk-cans{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:700px;margin:0 auto}
@media(max-width:700px){.pk-cans{grid-template-columns:repeat(2,1fr)}}
.pk-can{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted);text-decoration:none;transition:transform .25s var(--ease),border-color .25s}
.pk-can:hover{transform:translateY(-4px);border-color:var(--ooze);text-decoration:none;color:var(--text)}
.pk-can .nm{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase}
.pk-can .lv{font-size:.62rem;color:var(--dim)}
.pk-can .lv b{color:var(--text)}
.pk-can .dl{font-family:var(--display);font-weight:700;font-size:.7rem}
/* split ledger */
.pk-ledger{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:860px}
@media(max-width:700px){.pk-ledger{grid-template-columns:1fr}}
.pk-lpanel{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:6px 18px}
.pk-lrow{display:grid;grid-template-columns:26px 1fr auto 46px;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-size:.76rem;color:var(--text);text-decoration:none}
.pk-lrow:first-of-type{border-top:none}
.pk-lrow:hover{color:var(--ooze);text-decoration:none}
.pk-lrow b{font-family:var(--display);font-size:.76rem;text-align:right}
.pk-lrow .dl{font-size:.64rem;text-align:right;font-family:var(--display)}
/* rail: framed cards */
.pk-file{display:block;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:16px 18px;margin-bottom:12px;color:var(--text);text-decoration:none;position:relative;transition:border-color .2s}
.pk-file:hover{border-color:var(--ooze);text-decoration:none}
.pk-file .fico{position:absolute;top:16px;right:16px;font-size:1rem;opacity:.7}
.pk-file .fi-t{margin-top:2px}
.pk-latest{border-color:var(--line-hard)}
.pk-latest .fi-t{font-size:1.15rem}
.pk-latest .thumb{position:absolute;top:18px;right:16px}
.pk-learn a{display:flex;gap:12px;align-items:baseline;padding:12px 0;border-top:1px solid var(--line);font-size:.78rem;color:var(--muted)}
.pk-learn a:first-of-type{border-top:none}
.pk-learn a:hover{color:var(--ooze);text-decoration:none}

/* intake canisters — each line is a real little specimen jar */
.canisters{display:grid;grid-template-columns:repeat(4,1fr);gap:26px 14px;max-width:560px;margin:0 auto}
@media(max-width:600px){.canisters{grid-template-columns:repeat(2,1fr)}}
.canister{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted);text-decoration:none;transition:transform .25s var(--ease)}
.canister:hover{transform:translateY(-4px);text-decoration:none;color:var(--text)}
.can-glass{width:46px;height:60px;border:1px solid var(--line-hard);border-top:none;border-radius:0 0 14px 14px;position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(200,255,190,.03),rgba(200,255,190,.06))}
.can-glass::before{content:"";position:absolute;left:-4px;right:-4px;top:0;height:6px;background:#1c2617;border-bottom:1px solid var(--line-hard);border-radius:2px}
.can-glass i{position:absolute;bottom:0;left:0;right:0;border-radius:0 0 13px 13px}
.canister:hover .can-glass{box-shadow:0 0 16px rgba(163,255,18,.18)}
.can-name{font-size:.56rem;letter-spacing:.16em;text-transform:uppercase}
.can-d{font-size:.6rem;font-family:var(--display);font-weight:700}

/* research library rail — CNBC-clean file list */
.pvJ-accent{height:5px;background:linear-gradient(90deg,var(--ooze) 0 38%,transparent 38%);border-bottom:1px solid var(--line-hard);margin-bottom:18px}
.pvJ-railhead{font-family:var(--display);font-weight:900;font-size:1.05rem;letter-spacing:.06em;margin-bottom:6px}
.pvJ-railsub{font-size:.66rem;color:var(--dim);margin-bottom:10px}
.file-item{display:block;padding:16px 0;border-top:1px solid var(--line);color:var(--text);text-decoration:none}
.file-item:first-of-type{border-top:none}
.file-item:hover .fi-t{color:var(--ooze)}
.file-item:hover{text-decoration:none}
.fi-meta{display:flex;align-items:center;gap:8px;font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:7px}
.fi-dot{width:8px;height:8px;border-radius:50%;flex:none}
.fi-t{font-family:var(--display);font-weight:800;font-size:.92rem;line-height:1.4;transition:color .2s}
.fi-tease{font-size:.78rem;line-height:1.65;color:var(--muted);margin-top:8px;max-width:36ch}
.fi-read{display:inline-block;margin-top:10px;font-size:.66rem;letter-spacing:.16em}
.pvJ-legend{border-top:3px solid var(--line-hard);margin-top:20px;padding-top:14px;font-size:.6rem;letter-spacing:.08em;color:var(--dim);line-height:2}
.pvJ-legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px}
/* research library rail (base) */
.pvJ-rail{padding:50px 0 0 44px;position:sticky;top:70px;align-self:start}
@media(max-width:920px){.pvJ-rail{padding-left:0;position:static;border-top:1px solid var(--line);margin-top:50px;padding-top:36px}}
.pvJ-rail .file-h{font-size:.6rem;letter-spacing:.3em;color:var(--dim);text-transform:uppercase;margin-bottom:18px}
.pvJ-rail .today-file h2{font-family:var(--display);font-weight:800;font-size:1.15rem;line-height:1.35;margin-bottom:12px}
.pvJ-rail .today-file p{font-size:.82rem;line-height:1.7;color:var(--muted);max-width:34ch;margin-bottom:14px}
.pvJ-files{margin-top:40px}
.pvJ-files a{display:block;padding:12px 0;border-top:1px solid var(--line);font-size:.78rem;color:var(--muted)}
.pvJ-files a:first-of-type{border-top:none}
.pvJ-files a:hover{color:var(--ooze);text-decoration:none}

/* floating switcher — obviously not part of the design */
#pswitch{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:99;display:flex;align-items:center;gap:14px;background:#e6f2da;color:#0a0f08;border-radius:99px;padding:10px 18px;font-family:var(--mono);font-size:.72rem;font-weight:600;box-shadow:0 10px 40px rgba(0,0,0,.7)}
#pswitch button{background:none;border:none;font-size:1rem;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div id="page">
<div id="proto"></div>
</div>

<div id="pswitch">
  <button id="pPrev" aria-label="Previous variant">◀</button>
  <span id="pLabel">A</span>
  <button id="pNext" aria-label="Next variant">▶</button>
</div>

<script src="data/latest.js"></script>
<script src="data/editorial.js"></script>
<script src="articles.js"></script>
<script src="data/auto-articles.js"></script>
<script src="lab.js"></script>
<script>
renderHeader('');
const ALLA=(window.ARTICLES||[]).concat(window.AUTO_ARTICLES||[]).sort((a,b)=>b.date.localeCompare(a.date));
const lead=ALLA.find(a=>a.slug===EDITORIAL.articleSlug)||ALLA[0];
const others=ALLA.filter(a=>a!==lead).slice(0,3);
const CATL={report:['OOZE MONTHLY REPORT','var(--ooze)'],incident:['OOZE ARCHIVES','var(--red)'],explainer:['OOZEONOMICS','#5fd7ff'],manual:['OOZEONOMICS','#5fd7ff']};
const NN={gas:'Gas Prices',housing:'Housing',credit:'Credit Cards',auto:'Auto Loans',jobs:'Unemployment',inflation:'Inflation'};
const whyRows=Object.entries(LD.lines).filter(([,l])=>l.contributesToOoze!==false)
  .sort((a,b)=>b[1].contrib-a[1].contrib)
  .map(([k,l])=>`<a class="pv-why-row" href="indicator.html?i=${k}">
    <b>${NN[k]||k}</b><span>${l.value}</span>
    <span class="d ${l.delta>=0?'up':'down'}" style="color:${l.delta>=0?'var(--amber)':'var(--green)'}">${l.delta>=0?'▲':'▼'}${Math.abs(l.delta)}</span>
    <span class="why-t">${EDITORIAL.lines[k]||''}</span>
  </a>`).join('');
const reportCards=others.map(a=>{const[cl,cc]=CATL[a.cat]||CATL.manual;return `
  <a class="news-card" href="article.html?a=${a.slug}">
    <div class="nc-top"><span class="nc-cat" style="color:${cc};border-color:${cc}">${cl}</span>
    <span class="nc-date">${new Date(a.date+'T12:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}</span></div>
    <h3>${resolveClaims(a.title)}</h3><p>${resolveClaims(a.dek)}</p></a>`}).join('');
const miniJar=id=>`<div class="mini-jar"><div class="jar" id="${id}"></div></div>`;
const mastStrip=jid=>`
  <div class="wrap pv-mast">
    ${miniJar(jid)}
    <span><b style="color:${LEVELCOLORS[levelOf(TODAY_SCORE)-1]}">${TODAY_SCORE}</b><small style="color:var(--dim)">/100</small></span>
    <span class="pv-band" style="color:${LEVELCOLORS[levelOf(TODAY_SCORE)-1]}">${bandOf(TODAY_SCORE).name}</span>
    <span class="d" style="color:var(--green);font-size:.75rem">▼${Math.abs(TODAY_SCORE-YESTERDAY)} vs ${LD.prevMonthLabel.split(' ')[0]}</span>
    <span class="pv-verdict">${EDITORIAL.verdict}</span>
  </div>`;
const evidence=`
  <div class="wrap"><div class="sec-label">Can I verify it?</div>
  <div class="pv-evidence">
    <a href="index.html">🧪 The Instrument</a>
    <a href="notes.html">📋 Methodology</a>
    <a href="archive.html">📈 The Ooze Chart</a>
    <a href="specimen-progress.html">⏳ Specimen Progress</a>
    <a href="data/latest.json">{ } Raw Data</a>
  </div></div>`;

/* ============ VARIANT A — Dashboard-first (control: today's order) ============ */
function VariantA(){
  return `
  <section style="padding:40px 0;border-bottom:1px solid var(--line)"><div class="wrap" data-level="${levelOf(TODAY_SCORE)}" style="text-align:center">
    <div class="kicker">Containment Level — ${LD.monthLabel}</div>
    <div class="big-score">${TODAY_SCORE}<small>/100</small></div>
    <div class="status-row"><div class="status-chip">${bandOf(TODAY_SCORE).name}</div>
      <div class="delta" style="color:var(--green)">▼ −${Math.abs(TODAY_SCORE-YESTERDAY)} VS ${LD.prevMonthLabel.toUpperCase()}</div></div>
    <div class="verdict">${EDITORIAL.verdict}</div>
    <div style="max-width:280px;margin:26px auto 0"><div class="jar" id="jarA"></div></div>
  </div></section>
  <section style="padding:44px 0;border-bottom:1px solid var(--line)"><div class="wrap">
    <div class="sec-label">Pressure Sources</div><div class="pv-why">${whyRows}</div>
  </div></section>
  <section style="padding:44px 0;border-bottom:1px solid var(--line)"><div class="wrap">
    <div class="sec-label">This Month</div>
    <p class="household-story">${EDITORIAL.story}</p>
    <a class="btn primary" href="article.html?a=${lead.slug}">Read the full Ooze Report ▸</a>
  </div></section>
  <section style="padding:44px 0"><div class="wrap">
    <div class="sec-label">Latest from Oozeonomics</div>
    <div class="news-grid">${reportCards}</div>
  </div></section>
  ${evidence}`;
}

/* ============ VARIANT B — Story-first (the publication front page) ============ */
function VariantB(){
  return `
  ${mastStrip('jarB')}

/* ============ switcher ============ */
const VARIANTS={A:['Dashboard-first (control)',VariantA],B:['Story-first front page',VariantB],C:['Broadsheet split',VariantC],D:['Mission Control',VariantD],E:['Situation Room',VariantE],F:['The Instrument',VariantF],G:['Command Center',VariantG],H:['Story in Layers',VariantH],I:['Instrument-first split',VariantI],J:['Mission Control × Research Library',VariantJ]};
const KEYS=Object.keys(VARIANTS);
function current(){const v=new URLSearchParams(location.search).get('variant');return KEYS.includes(v)?v:'B'}
function render(v){
  const [name,fn]=VARIANTS[v];
  document.getElementById('proto').innerHTML=fn();
  document.getElementById('pLabel').textContent=`${v} — ${name}`;
  /* real jars, filled to the real score, settled per doctrine */
  ['jarA','jarB','jarC','jarC2','jarD','jarE','jarF','jarG','jarH','jarI','jarJ'].forEach(id=>{
    const el=document.getElementById(id);
    if(el){el.closest('[data-level]')||el.parentElement.setAttribute('data-level',levelOf(TODAY_SCORE));
      buildJar(el);setJar(el,el.parentElement.closest('[data-level]')||el.parentElement,TODAY_SCORE);}
  });
  document.title=`PROTOTYPE ${v} — ${name} | OOZEMeter`;
  wireReveals(); /* variant H layers reveal-once */
}
function go(dir){
  const i=(KEYS.indexOf(current())+dir+KEYS.length)%KEYS.length;
  const u=new URL(location);u.searchParams.set('variant',KEYS[i]);
  history.replaceState(null,'',u);render(KEYS[i]);
}
document.getElementById('pPrev').addEventListener('click',()=>go(-1));
document.getElementById('pNext').addEventListener('click',()=>go(1));
document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)||document.activeElement.isContentEditable)return;
  if(e.key==='ArrowLeft')go(-1);
  if(e.key==='ArrowRight')go(1);
});
render(current());
renderFooter();
</script>

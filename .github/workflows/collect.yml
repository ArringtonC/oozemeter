name: daily-collection
on:
  schedule:
    - cron: '45 13 * * *'   # 13:45 UTC ≈ 9:45am ET, after the 8:30 data drops
  workflow_dispatch: {}      # manual "collect now" button
permissions:
  contents: write
  issues: write
concurrency:
  group: oozemeter-publication
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: verify collector contracts
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          command -v unzip
          node --test --test-concurrency=1 tests/backtest.integration.test.js tests/methodology.test.js tests/fetch.test.js tests/fingerprint.test.js tests/fred.test.js tests/integrity.test.js tests/nyfed.integration.test.js tests/collector.integration.test.js tests/collector-reliability.integration.test.js tests/public-labels.test.js tests/release-gate.test.js tests/market-divergence.test.js tests/market-integrity.test.js tests/narrative-check.test.js tests/claim-gate.test.js tests/sync-fallback-history.test.js tests/line-history.test.js tests/workflow.test.js
      - name: collect release-aware specimen
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          node scripts/collect.js
          # Stays daily on purpose, so the ward-vs-jar chart picks up each newly
          # sealed household month (tests/workflow.test.js:46 and the v5 Data
          # ledger row both require it). The real defect was never the cadence —
          # it was that the join carried ONE vintage, the market's, while its
          # household column moved daily. It now stamps marketVintage,
          # householdVintage and vintagesAligned, so the gap is disclosed
          # instead of hidden.
          node scripts/build-market-divergence.js
          # Source revisions move historical values a point at a time, and the
          # archive reconstructions bake their figures as literals. Regenerate
          # them from the same revised data BEFORE any gate compares — the
          # narrative gate's own remediation names this pair — then repaint the
          # recon pages + sitemap so readers see the same figure the gate
          # checked. Without this, every revision fails the run: the 2026-08-14
          # and 2026-08-26 drifts, five months each time.
          node scripts/backtest.js
          node scripts/build-line-history.js
          node scripts/backfill-reports.js
          node scripts/static-pages.js
      - name: integrity gate + public stamping
        run: |
          node scripts/sync-fallback-history.js
          node scripts/integrity.js
          node scripts/market-integrity.js
          node scripts/story.js
          node scripts/claim-gate.js
          node gauntlet/run.js
          node scripts/narrative-check.js
          node scripts/stamp.js
          node scripts/rss.js
          node scripts/release-gate.js --inspect-only
      - name: commit fresh specimen
        id: commit
        run: |
          git config user.name "oozebot"
          git config user.email "oozebot@users.noreply.github.com"
          # research/ (backtest), files/ + sitemap.xml (static pages) and data/
          # (reconstructions + vintages) are all regenerated before the gates,
          # and the reconstructions assert against committed artifacts — the
          # commit must carry them together or a later rebuild reverts the pages.
          git add data/market-history.json data/market-history.js data/ research/ files/ sitemap.xml index.html feed.xml lab.js
          if git diff --cached --quiet; then
            echo "no new data"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(node -e "const d=require('./data/latest.json');process.stdout.write(d.collection.changed?'new release':'freshness check')")
          git commit -m "specimen ${changed} $(date -u +%F)"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          node -e "const d=require('./data/latest.json');console.log('expected='+d.generated)" >> "$GITHUB_OUTPUT"
      # Publishing is not the same as being published. From 2026-08-14 to 08-16
      # every collection here went green while pages-build-deployment failed on
      # a Liquid parse error, so the robot committed fresh specimens for two
      # days that no reader could see. pages-build-deployment is generated by
      # GitHub and cannot carry our alerting, so the loop gets closed from this
      # side: confirm the live site is actually serving what we just pushed.
      # Failing here trips the existing alert step below.
      - name: verify the live site received it
        if: ${{ steps.commit.outputs.pushed == 'true' }}
        run: |
          expected="${{ steps.commit.outputs.expected }}"
          echo "waiting for https://arringtonc.github.io/oozemeter/ to serve generated=$expected"
          for i in $(seq 1 20); do
            live=$(curl -sf "https://arringtonc.github.io/oozemeter/data/latest.json?cb=$RANDOM" \
                   | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).generated||'')}catch{process.stdout.write('')}})" || true)
            if [ "$live" = "$expected" ]; then
              echo "live site is current after $((i*15))s"
              exit 0
            fi
            echo "  [$i/20] live=${live:-unreachable}"
            sleep 15
          done
          echo "::error::The collection published successfully but the live site is still serving stale data after 5 minutes."
          echo "Expected generated=$expected. Check pages-build-deployment — a failing deploy is invisible from this workflow's own status."
          exit 1
      - name: alert on collection failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='[OOZEMeter] Daily collection failure'
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          issue=$(gh issue list --state open --search '"[OOZEMeter] Daily collection failure" in:title' --json number --jq '.[0].number // empty')
          body="The daily collection workflow failed. Inspect the run before publishing another specimen: ${run_url}"
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
      - name: close recovered collection alert
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue=$(gh issue list --state open --search '"[OOZEMeter] Daily collection failure" in:title' --json number --jq '.[0].number // empty')
          if [[ -n "$issue" ]]; then
            run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            gh issue close "$issue" --comment "Collection recovered successfully: ${run_url}"
          fi

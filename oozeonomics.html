<meta name="description" content="Oozeonomics: the study of economic slime. Monthly specimen reports, incident files, and plain-language explainers — every number checked against public data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800;900&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<meta property="og:type" content="website">
<meta property="og:site_name" content="OOZEMeter">
<meta property="og:title" content="Oozeonomics — Reports & Explainers | OOZEMeter">
<meta property="og:description" content="Oozeonomics: the study of economic slime. Monthly specimen reports, incident files, and plain-language explainers — every number checked against public data.">
<meta property="og:image" content="https://arringtonc.github.io/oozemeter/og-card.png">
<meta property="og:url" content="https://arringtonc.github.io/oozemeter/oozeonomics.html">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="lab.css">
</head>
<body>
<div id="page">

<section style="padding-top:34px">
  <div class="wrap">
    <div class="crumbs" style="padding-bottom:18px"><a href="index.html">Facility</a> / Oozeonomics</div>
    <div class="sec-label">The Editorial Wing</div>
    <h1 class="sec-title">OOZEONOMICS</h1>
    <p class="sec-sub">The study of economic slime. Monthly specimen reports, incident files, and plain-language explainers — every number checked against the data before it publishes. Facility-drafted pieces are seeded below; operator dispatches mix in.</p>
    <div class="news-grid" id="newsGrid"></div>

  </div>
</section>

</div><!-- /page -->

<script src="data/latest.js"></script>
<script src="articles.js"></script>
<script src="data/auto-articles.js"></script>
<script src="data/reconstruction-reports.js"></script>
<script src="lab.js"></script>
<script>
renderHeader('news');
const CATS={report:['OOZE MONTHLY REPORT','var(--ooze)'],incident:['OOZE ARCHIVES','var(--red)'],
            explainer:['OOZEONOMICS','var(--cyan, #5fd7ff)'],manual:['OOZEONOMICS','var(--cyan, #5fd7ff)']};
$('newsGrid').innerHTML=[...(window.ARTICLES||[]),...(window.AUTO_ARTICLES||[]),...(window.RECON_ARTICLES||[])].sort((a,b)=>b.date.localeCompare(a.date)).map(a=>{
  const [label,col]=CATS[a.cat]||CATS.manual;
  return `<a class="news-card" href="article.html?a=${a.slug}">
    <div class="nc-top"><span class="nc-cat" style="color:${col};border-color:${col}">${label}</span>
    <span class="nc-date">${new Date(a.date+'T12:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</span></div>
    <h3>${resolveClaims(a.title)}</h3><p>${resolveClaims(a.dek)}</p>
  </a>`}).join('');
renderFooter();
wireReveals();
</script>
</body>
</html>

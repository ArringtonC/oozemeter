<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="../../">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070b06">
<title>June seals at 27: the jar drains 3 points — Oozeonomics | OOZEMeter</title>
<meta name="description" content="Gas and inflation eased at the same time — the biggest one-month relief since the winter.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800;900&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:site_name" content="OOZEMeter">
<meta property="og:title" content="June seals at 27: the jar drains 3 points — Oozeonomics | OOZEMeter">
<meta property="og:description" content="Gas and inflation eased at the same time — the biggest one-month relief since the winter.">
<meta property="og:image" content="https://arringtonc.github.io/oozemeter/og-card.png">
<meta property="og:url" content="https://arringtonc.github.io/oozemeter/files/june-2026-seal/">
<link rel="canonical" href="https://arringtonc.github.io/oozemeter/files/june-2026-seal/">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="lab.css">
</head>
<body>
<div id="page">
<main class="wrap-narrow" id="main"></main>
</div>

<script>window.FORCED_SLUG='june-2026-seal';document.addEventListener('click',function(e){var a=e.target.closest('a[href^="#"]');if(!a)return;e.preventDefault();var t=document.getElementById(a.getAttribute('href').slice(1));if(t)t.scrollIntoView({behavior:'smooth'});history.replaceState(null,'',location.pathname+a.getAttribute('href'))});</script>
<script src="data/latest.js"></script>
<script src="articles.js"></script>
<script src="data/auto-articles.js"></script>
<script src="data/editorial.js"></script>
<script src="lab.js"></script>
<script>
renderHeader('news');
/* golden-master article template: every generated or hand-written piece renders
   through this exact layout. ?a=slug selects from articles.js */
const CATS={report:['OOZE MONTHLY REPORT','var(--ooze)'],incident:['OOZE ARCHIVES','var(--red)'],
            explainer:['OOZEONOMICS','#5fd7ff'],manual:['OOZEONOMICS','#5fd7ff']};
const ALL_ARTICLES=(window.ARTICLES||[]).concat(window.AUTO_ARTICLES||[]);
const slug=new URLSearchParams(location.search).get('a')||window.FORCED_SLUG||ALL_ARTICLES[0].slug;
const found=ALL_ARTICLES.find(x=>x.slug===slug);
const a=found||ALL_ARTICLES[0];
const [catLabel,catCol]=CATS[a.cat]||CATS.manual;
document.title=`${resolveClaims(a.title)} — Oozeonomics | OOZEMeter`;

const dateFmt=new Date(a.date+'T12:00').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
/* body: paragraphs; "## " lines become h3; the sponsor beaker lands after ¶2 */
const AD=`<div class="beaker-ad"><div class="ba-jar"><i></i></div>
  <div><b>Sponsored specimen — slot available</b>
  <p>One sponsor per article, logo on the beaker. Never on the Jar. Modeled placeholder.</p></div>
  <span class="ba-tag">AD</span></div>`;
let bodyHtml='',pCount=0;
for(const line of a.body){
  if(line.startsWith('## ')){bodyHtml+=`<h3>${resolveClaims(line.slice(3))}</h3>`;continue}
  bodyHtml+=`<p>${resolveClaims(line)}</p>`;
  if(++pCount===2)bodyHtml+=AD;
}

const others=ALL_ARTICLES.filter(x=>x.slug!==a.slug).slice(0,3);
$('main').innerHTML=`
  ${found?'':'<div class="crumbs" style="color:var(--amber);padding-top:20px">⚠ FILE NOT FOUND — showing the most recent report instead.</div>'}
  <div class="crumbs" style="padding-bottom:20px"><a href="index.html">Facility</a> / <a href="oozeonomics.html">Oozeonomics</a> / ${a.title}</div>
  <div class="art-eyebrow" style="color:${catCol}">${catLabel}</div>
  <h1 class="art-title">${resolveClaims(a.title)}</h1>
  <p class="art-dek">${resolveClaims(a.dek)}</p>
  <div class="art-dateline">${a.auto?a.byline:'Operator dispatch · Division of Economic Containment'} · ${dateFmt} · Jar at publication: ${LIVE?TODAY_SCORE+' ('+bandOf(TODAY_SCORE).name+')':'offline'}</div>
  <div class="keypoints"><div class="kp-h">Key Points</div><ul>${a.keyPoints.map(k=>`<li>${resolveClaims(k)}</li>`).join('')}</ul></div>
  <div class="art-body">${bodyHtml}</div>
  <div class="reveal" style="margin-top:44px">
    <div class="sec-label">More Oozeonomics</div>
    <div class="news-grid">${others.map(o=>{const[l,c]=CATS[o.cat]||CATS.manual;return `
      <a class="news-card" href="article.html?a=${o.slug}">
        <div class="nc-top"><span class="nc-cat" style="color:${c};border-color:${c}">${l}</span>
        <span class="nc-date">${new Date(o.date+'T12:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}</span></div>
        <h3>${resolveClaims(o.title)}</h3><p>${resolveClaims(o.dek)}</p></a>`}).join('')}
    </div>
  </div>`;
/* AUDIT-7: Article structured data so search + AI answer engines can cite us */
const ld={'@context':'https://schema.org','@type':'Article',headline:resolveClaims(a.title),
  description:resolveClaims(a.dek),datePublished:a.date,
  author:{'@type':'Organization',name:'OOZEMeter'},
  publisher:{'@type':'Organization',name:'OOZEMeter — Division of Economic Containment',
    url:'https://arringtonc.github.io/oozemeter'}};
const ldTag=document.createElement('script');
ldTag.type='application/ld+json';
ldTag.textContent=JSON.stringify(ld);
document.head.appendChild(ldTag);

/* previous / next article */
const sorted=[...ALL_ARTICLES].sort((x,y)=>y.date.localeCompare(x.date));
const ai=sorted.findIndex(x=>x.slug===a.slug);
const prevA=sorted[ai+1],nextA=sorted[ai-1];
if(prevA||nextA)$('main').insertAdjacentHTML('beforeend',`
  <div class="filenav">
    ${prevA?`<a href="article.html?a=${prevA.slug}"><span class="fn-k">◂ Older</span>${resolveClaims(prevA.title)}</a>`:'<span></span>'}
    ${nextA?`<a href="article.html?a=${nextA.slug}" style="text-align:right"><span class="fn-k">Newer ▸</span>${resolveClaims(nextA.title)}</a>`:'<span></span>'}
  </div>`);

renderFooter();
wireReveals();
</script>
</body>
</html>
